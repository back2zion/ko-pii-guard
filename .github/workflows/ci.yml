name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Disable Guardrails telemetry
        run: printf "id=ci\nenable_metrics=false\n" > ~/.guardrailsrc
      - name: Install
        run: uv sync --frozen --extra dev --extra guardrails
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test
        run: uv run --frozen pytest -q
      - name: Benchmark
        run: uv run --frozen python benchmarks/synthetic_benchmark.py
